[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-legged-control"
version = "0.1.0"
description = "Engine-independent wheel-legged robot control and physics interfaces"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
policy = ["torch>=2"]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["wheel_legged*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["scripts/tools"]
